<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 深空钛金无白边底板渐变 -->
    <linearGradient id="titaniumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222636" />
      <stop offset="100%" stop-color="#10121A" />
    </linearGradient>

    <!-- 液态水银微白银渐变 -->
    <linearGradient id="liquidSilver" x1="26%" y1="12%" x2="74%" y2="88%">

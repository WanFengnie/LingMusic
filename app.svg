      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1.0" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="75%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- 符头中央微凸聚光 -->
    <radialGradient id="headGlow" cx="48%" cy="52%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.90" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </radialGradient>
  </defs>

